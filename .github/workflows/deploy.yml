name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H raspi >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for Tailscale connectivity
        run: tailscale ping --timeout 60s raspi

      - name: Generate .env file
        run: |
          cat > /tmp/deploy.env <<EOF
          DATABASE_URL=postgres://ug_user:ug_pass@db:5432/urban_garbanzo
          DATABASE_GENERATE_SCHEMAS=false
          API_HOST=0.0.0.0
          API_PORT=8000
          DEBUG=false
          APP_NAME=urban-garbanzo
          APP_VERSION=0.1.0
          LOG_LEVEL=INFO
          CORS_ORIGINS=["https://urban-garbanzo.dev-master.in","http://localhost:8000"]
          LLM_PROVIDER=${LLM_PROVIDER}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          HEURISTIC_WEIGHT=0.3
          LLM_WEIGHT=0.7
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

      - name: Generate docker-compose.yml for production
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cat > /tmp/docker-compose.yml <<EOF
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: ug_user
                POSTGRES_PASSWORD: ug_pass
                POSTGRES_DB: urban_garbanzo
              volumes:
                - pg_data:/var/lib/postgresql/data
              restart: unless-stopped

            app:
              image: ghcr.io/${IMAGE_LOWER}:latest
              env_file: .env
              ports:
                - "8000:8000"
              depends_on:
                - db
              restart: unless-stopped

          volumes:
            pg_data:
          EOF

      - name: Deploy to Raspberry Pi
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Ensure deploy directory exists on the Pi
          ssh -o StrictHostKeyChecking=no deploy@raspi "mkdir -p /home/deploy/urban-garbanzo"

          # Copy .env and docker-compose.yml to the Pi
          scp -o StrictHostKeyChecking=no /tmp/deploy.env deploy@raspi:/home/deploy/urban-garbanzo/.env
          scp -o StrictHostKeyChecking=no /tmp/docker-compose.yml deploy@raspi:/home/deploy/urban-garbanzo/docker-compose.yml

          # SSH in and run deployment commands
          ssh -o StrictHostKeyChecking=no deploy@raspi << ENDSSH
          set -e

          echo "==> Logging into GHCR..."
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          echo "==> Pulling latest image..."
          docker pull ghcr.io/${IMAGE_LOWER}:latest

          echo "==> Restarting services..."
          cd /home/deploy/urban-garbanzo
          docker compose down || true
          docker compose up -d

          echo "==> Pruning old images..."
          docker image prune -f

          echo "==> Deploy complete!"
          docker compose ps
          ENDSSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
