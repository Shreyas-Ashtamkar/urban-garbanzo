name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Confirm Tailscale can reach raspi (DERP relay is fine)
          tailscale ping --timeout 60s --until-direct=false raspi

          # Try upgrading to a direct WireGuard tunnel — far more reliable than DERP
          echo "Attempting direct Tailscale connection..."
          tailscale ping --timeout 15s --until-direct=true raspi 2>&1 || echo "Direct unavailable — using DERP relay"

          # Resolve Tailscale IP and populate known_hosts
          RASPI_IP=$(tailscale ip -4 raspi 2>/dev/null || true)
          if [ -z "$RASPI_IP" ]; then
            echo "Could not resolve Tailscale IPv4 — falling back to hostname"
            RASPI_IP="raspi"
          fi
          echo "Target: $RASPI_IP"
          echo "RASPI_IP=$RASPI_IP" >> "$GITHUB_ENV"
          ssh-keyscan -T 10 -H "$RASPI_IP" 2>/dev/null >> ~/.ssh/known_hosts || true

      - name: Prepare deploy files
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          cat > /tmp/.env <<EOF
          DATABASE_URL=postgres://ug_user:ug_pass@db:5432/urban_garbanzo
          DATABASE_GENERATE_SCHEMAS=false
          API_HOST=0.0.0.0
          API_PORT=8000
          DEBUG=false
          APP_NAME=urban-garbanzo
          APP_VERSION=0.1.0
          LOG_LEVEL=INFO
          CORS_ORIGINS=["https://urban-garbanzo.dev-master.in","http://localhost:8000"]
          LLM_PROVIDER=${LLM_PROVIDER}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          HEURISTIC_WEIGHT=0.3
          LLM_WEIGHT=0.7
          EOF

          cat > /tmp/docker-compose.yml <<EOF
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: ug_user
                POSTGRES_PASSWORD: ug_pass
                POSTGRES_DB: urban_garbanzo
              volumes:
                - pg_data:/var/lib/postgresql/data
              restart: unless-stopped

            app:
              image: ghcr.io/${IMAGE_LOWER}:latest
              env_file: .env
              ports:
                - "8000:8000"
              depends_on:
                - db
              restart: unless-stopped

          volumes:
            pg_data:
          EOF

          # Deploy script — unquoted heredoc so runner-side env vars are baked in
          cat > /tmp/deploy.sh <<DEPLOY
          #!/bin/bash
          set -euo pipefail
          echo "==> GHCR login"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          echo "==> Pull image"
          docker pull ghcr.io/${IMAGE_LOWER}:latest
          echo "==> Deploy"
          cd /home/deploy/urban-garbanzo
          docker compose down || true
          docker compose up -d
          docker image prune -f
          echo "==> Status"
          docker compose ps
          DEPLOY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Deploy to Raspberry Pi
        run: |
          set -euo pipefail
          RASPI="${RASPI_IP:-raspi}"

          SSH_OPTS=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=3
            -o IPQoS=none
          )

          # Retry with exponential backoff — essential for DERP relay flakiness
          retry() {
            local max=$1; shift
            local delay=3
            for attempt in $(seq 1 "$max"); do
              echo "[attempt $attempt/$max] $*"
              if "$@"; then return 0; fi
              if [ "$attempt" -lt "$max" ]; then
                echo "  Failed — retrying in ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "FAILED after $max attempts: $*"
            return 1
          }

          # 1. Create target directory (retry up to 5 times)
          retry 5 ssh "${SSH_OPTS[@]}" "deploy@$RASPI" "mkdir -p /home/deploy/urban-garbanzo"

          # 2. SCP all files in one call (retry up to 5 times)
          retry 5 scp "${SSH_OPTS[@]}" /tmp/.env /tmp/docker-compose.yml /tmp/deploy.sh "deploy@$RASPI:/home/deploy/urban-garbanzo/"

          # 3. Execute deploy script (retry up to 3 times), then clean up separately
          retry 3 ssh "${SSH_OPTS[@]}" "deploy@$RASPI" "cd /home/deploy/urban-garbanzo && bash deploy.sh"
          ssh "${SSH_OPTS[@]}" "deploy@$RASPI" "rm -f /home/deploy/urban-garbanzo/deploy.sh" || true
