name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Wait for Tailscale connectivity
        run: |
          tailscale ping --timeout 60s --until-direct=false raspi

          # Resolve the explicit Tailscale IPv4 address — Tailscale IPs are always in 100.x.x.x
          RASPI_IP=$(tailscale ip -4 raspi 2>/dev/null)
          if [ -z "$RASPI_IP" ]; then
            RASPI_IP=$(tailscale ip raspi 2>/dev/null | grep -E '^100\.' | head -1)
          fi
          if [ -z "$RASPI_IP" ]; then
            echo "WARNING: Could not resolve Tailscale IPv4 for raspi, falling back to hostname"
            RASPI_IP="raspi"
          fi
          echo "raspi Tailscale IP: $RASPI_IP"
          echo "RASPI_IP=$RASPI_IP" >> "$GITHUB_ENV"

          # Scan by both hostname and IP so known_hosts covers whichever address SSH resolves to.
          # Also acts as a TCP connectivity probe — if keyscan produces 0 entries, port 22 may be blocked.
          ssh-keyscan -T 10 -H raspi "$RASPI_IP" 2>/dev/null >> ~/.ssh/known_hosts || true
          echo "Known hosts entries: $(wc -l < ~/.ssh/known_hosts)"

      - name: Generate .env file
        run: |
          cat > /tmp/deploy.env <<EOF
          DATABASE_URL=postgres://ug_user:ug_pass@db:5432/urban_garbanzo
          DATABASE_GENERATE_SCHEMAS=false
          API_HOST=0.0.0.0
          API_PORT=8000
          DEBUG=false
          APP_NAME=urban-garbanzo
          APP_VERSION=0.1.0
          LOG_LEVEL=INFO
          CORS_ORIGINS=["https://urban-garbanzo.dev-master.in","http://localhost:8000"]
          LLM_PROVIDER=${LLM_PROVIDER}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          OPENAI_BASE_URL=${OPENAI_BASE_URL}
          HEURISTIC_WEIGHT=0.3
          LLM_WEIGHT=0.7
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

      - name: Generate docker-compose.yml for production
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cat > /tmp/docker-compose.yml <<EOF
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: ug_user
                POSTGRES_PASSWORD: ug_pass
                POSTGRES_DB: urban_garbanzo
              volumes:
                - pg_data:/var/lib/postgresql/data
              restart: unless-stopped

            app:
              image: ghcr.io/${IMAGE_LOWER}:latest
              env_file: .env
              ports:
                - "8000:8000"
              depends_on:
                - db
              restart: unless-stopped

          volumes:
            pg_data:
          EOF

      - name: Deploy to Raspberry Pi
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Use explicit Tailscale IP to avoid any DNS inconsistency
          RASPI="${RASPI_IP:-raspi}"
          echo "Connecting to raspi at: $RASPI"

          # Use a bash array to avoid word-splitting issues with SSH options.
          # StrictHostKeyChecking=accept-new: verify keys for known hosts (populated by ssh-keyscan above),
          # accept and add keys for new hosts — more secure than =no while still non-interactive.
          SSH_OPTS=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=30
          )

          # Verify TCP port 22 is reachable before SSH attempts (nc with /dev/tcp fallback)
          echo "==> Checking TCP connectivity to $RASPI:22 ..."
          if command -v nc >/dev/null 2>&1; then
            nc -zv -w 10 "$RASPI" 22 2>&1
          else
            timeout 10 bash -c 'echo > /dev/tcp/'"$RASPI"'/22' 2>&1
          fi || { echo "Port 22 unreachable on $RASPI"; exit 1; }

          # Probe with verbose SSH on the first attempt to surface any auth/handshake issues
          echo "==> Probing SSH connectivity (verbose) ..."
          ssh -v "${SSH_OPTS[@]}" "deploy@$RASPI" "echo SSH_OK" 2>&1 || {
            echo "SSH probe failed — aborting deploy"
            exit 1
          }

          # Write the deploy script locally (local heredoc, no SSH stdin piping)
          cat > /tmp/urban-garbanzo-deploy.sh << SCRIPT
          #!/bin/bash
          set -e

          echo "==> Logging into GHCR..."
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          echo "==> Pulling latest image..."
          docker pull ghcr.io/${IMAGE_LOWER}:latest

          echo "==> Restarting services..."
          cd /home/deploy/urban-garbanzo
          docker compose down || true
          docker compose up -d

          echo "==> Pruning old images..."
          docker image prune -f

          echo "==> Deploy complete!"
          docker compose ps
          SCRIPT
          chmod +x /tmp/urban-garbanzo-deploy.sh

          # Ensure deploy directory exists on the Pi
          ssh "${SSH_OPTS[@]}" "deploy@$RASPI" "mkdir -p /home/deploy/urban-garbanzo"

          # Copy all files to the Pi
          scp "${SSH_OPTS[@]}" /tmp/deploy.env "deploy@$RASPI:/home/deploy/urban-garbanzo/.env"
          scp "${SSH_OPTS[@]}" /tmp/docker-compose.yml "deploy@$RASPI:/home/deploy/urban-garbanzo/docker-compose.yml"
          scp "${SSH_OPTS[@]}" /tmp/urban-garbanzo-deploy.sh "deploy@$RASPI:/tmp/urban-garbanzo-deploy.sh"

          # Execute the deploy script and always clean up the temp file
          ssh "${SSH_OPTS[@]}" "deploy@$RASPI" "bash /tmp/urban-garbanzo-deploy.sh; EXIT=\$?; rm -f /tmp/urban-garbanzo-deploy.sh; exit \$EXIT"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
