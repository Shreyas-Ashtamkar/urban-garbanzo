{% extends "base.html" %}

{% block title %}urban-garbanzo | Editor{% endblock %}

{% block content %}
<div class="editor-shell">
  <nav class="editor-nav">
    <a href="/" class="nav-brand">urban-garbanzo</a>
    <a href="/" class="nav-back">Back to home</a>
  </nav>

  <main class="editor-main">
    <!-- Loading state: shown while evaluation is in-flight -->
    <section class="score-bar" id="loading-state" style="display:none;" aria-live="polite" aria-label="Evaluating prompt">
      <div class="score-grid">
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
        <div class="score-skeleton-card">
          <div class="score-skeleton-label"></div>
          <div class="score-skeleton-value"></div>
        </div>
      </div>
    </section>

    <!-- Results container: populated by JS after evaluation -->
    <section class="score-bar" id="results-container" style="display:none;"></section>

    <form method="post" action="/editor" id="editor-form" novalidate>
      <div class="editor-toolbar">
        <label class="editor-model-field">
          <span class="meta-label">Target model</span>
          <input
            type="text"
            name="target_model"
            id="target-model"
            placeholder="e.g. gpt-4.1, gemini-2.5-pro, claude-3.7"
            value="{{ form_data.target_model }}"
          >
        </label>
        <button type="submit" class="check-button" id="check-button">Check prompt</button>
      </div>
      <div id="error-banner" class="banner error editor-banner" style="display:none;"></div>
      <div class="editor-panes">
        <div class="pane pane-editor">
          <div class="pane-label">Markdown</div>
          <div id="codemirror-host"></div>
          <noscript>
            <textarea
              name="text"
              rows="28"
              placeholder="Write your prompt here (markdown supported)..."
              required
              minlength="10"
            >{{ form_data.text }}</textarea>
          </noscript>
          <input type="hidden" name="text" id="text-hidden" value="{{ form_data.text | e }}">
        </div>
        <div class="pane pane-preview">
          <div class="pane-label">Preview</div>
          <div class="preview-content" id="preview-content"></div>
        </div>
      </div>
    </form>
  </main>
</div>

<!-- CodeMirror 6 and marked.js from CDN -->
<script type="module">
  // Dynamically load CodeMirror 6 bundles (ESM)
  const CM_BASE = "https://esm.sh/@codemirror";
  const MARKED  = "https://esm.sh/marked@12";

  // -----------------------------------------------------------------------
  // Score colour helpers
  // -----------------------------------------------------------------------

  /** Fields where a LOWER value is better (inverted scale). */
  const INVERTED_FIELDS = new Set(["hallucination_risk", "redundancy"]);

  /**
   * Return a CSS class name based on the numeric score and whether the
   * metric is inverted (lower = better).
   */
  function scoreClass(field, value) {
    const v = Number(value);
    if (INVERTED_FIELDS.has(field)) {
      // ≤30 → good, 31-60 → okay, >60 → bad
      if (v <= 30) return "score-good";
      if (v <= 60) return "score-okay";
      return "score-bad";
    }
    // ≥70 → good, 40-69 → okay, <40 → bad
    if (v >= 70) return "score-good";
    if (v >= 40) return "score-okay";
    return "score-bad";
  }

  // -----------------------------------------------------------------------
  // DOM helpers
  // -----------------------------------------------------------------------

  function showError(msg) {
    const banner = document.getElementById("error-banner");
    banner.textContent = msg;
    banner.style.display = "";
  }

  function clearError() {
    const banner = document.getElementById("error-banner");
    banner.textContent = "";
    banner.style.display = "none";
  }

  function renderResults(prompt, evaluation) {
    const container = document.getElementById("results-container");
    const scores = evaluation.scores;

    const cards = [
      { field: "total_score",         label: "Total score",        value: scores.total_score,         extra: "accent" },
      { field: "clarity",             label: "Clarity",            value: scores.clarity },
      { field: "correctness",         label: "Correctness",        value: scores.correctness },
      { field: "information_density", label: "Info density",       value: scores.information_density },
      { field: "hallucination_risk",  label: "Hallucination risk", value: scores.hallucination_risk,  extra: "danger" },
      { field: "redundancy",          label: "Redundancy",         value: scores.redundancy,           extra: "danger" },
    ];

    const cardHTML = cards.map(({ field, label, value, extra }) => {
      const colorCls = scoreClass(field, value);
      const baseCls = extra ? `score-card ${extra} ${colorCls}` : `score-card ${colorCls}`;
      return `<div class="${baseCls}">
        <span>${label}</span>
        <strong>${value}</strong>
      </div>`;
    }).join("");

    const metaHTML = `
      <div class="score-meta">
        <div class="score-meta-item">
          <span class="meta-label">Target model</span>
          <strong>${escHtml(prompt.target_model)}</strong>
        </div>
        <div class="score-meta-item">
          <span class="meta-label">Provider</span>
          <strong>${escHtml(evaluation.llm_provider)}</strong>
        </div>
      </div>`;

    const rationaleHTML = evaluation.rationale
      ? `<div class="score-rationale">
           <span class="meta-label">Rationale</span>
           <p>${escHtml(evaluation.rationale)}</p>
         </div>`
      : "";

    container.innerHTML = metaHTML
      + `<div class="score-grid">${cardHTML}</div>`
      + rationaleHTML;
    container.style.display = "";
    container.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // -----------------------------------------------------------------------
  // Async evaluation
  // -----------------------------------------------------------------------

  async function evaluatePrompt(text, targetModel) {
    // Step 1: create the prompt
    const createResp = await fetch("/api/v1/prompts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, target_model: targetModel || "generic" }),
    });
    if (!createResp.ok) {
      const err = await createResp.json().catch(() => ({}));
      throw new Error(err.detail || `Failed to create prompt (${createResp.status})`);
    }
    const prompt = await createResp.json();

    // Step 2: evaluate it
    const evalResp = await fetch(`/api/v1/prompts/${prompt.id}/evaluate`, {
      method: "POST",
    });
    if (!evalResp.ok) {
      const err = await evalResp.json().catch(() => ({}));
      throw new Error(err.detail || `Evaluation failed (${evalResp.status})`);
    }
    const evaluation = await evalResp.json();
    return { prompt, evaluation };
  }

  // -----------------------------------------------------------------------
  // Main init
  // -----------------------------------------------------------------------

  async function init() {
    const [
      { EditorState },
      { EditorView, keymap, lineNumbers, highlightActiveLine },
      { defaultKeymap, historyKeymap, history },
      { markdown },
      { oneDark },
      { marked },
    ] = await Promise.all([
      import(`${CM_BASE}/state@6`),
      import(`${CM_BASE}/view@6`),
      import(`${CM_BASE}/commands@6`),
      import(`${CM_BASE}/lang-markdown@6`),
      import(`${CM_BASE}/theme-one-dark@6`),
      import(MARKED),
    ]);

    const host = document.getElementById("codemirror-host");
    const hiddenInput = document.getElementById("text-hidden");
    const previewEl = document.getElementById("preview-content");
    const checkBtn = document.getElementById("check-button");
    const loadingEl = document.getElementById("loading-state");
    const resultsEl = document.getElementById("results-container");

    const initialText = hiddenInput.value;
    hiddenInput.value = initialText;

    function updatePreview(text) {
      previewEl.innerHTML = marked.parse(text);
    }

    const updateListener = EditorView.updateListener.of((update) => {
      if (update.docChanged) {
        const text = update.state.doc.toString();
        hiddenInput.value = text;
        updatePreview(text);
      }
    });

    const state = EditorState.create({
      doc: initialText,
      extensions: [
        history(),
        keymap.of([...defaultKeymap, ...historyKeymap]),
        lineNumbers(),
        highlightActiveLine(),
        markdown(),
        oneDark,
        updateListener,
        EditorView.lineWrapping,
      ],
    });

    const view = new EditorView({ state, parent: host });

    // Initial preview render
    updatePreview(initialText);

    // -----------------------------------------------------------------------
    // Async form submit with single-flight guard
    // -----------------------------------------------------------------------

    let isSubmitting = false;

    document.getElementById("editor-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      if (isSubmitting) return;          // reject duplicate clicks
      isSubmitting = true;

      // Sync hidden input from editor
      hiddenInput.value = view.state.doc.toString();
      const text = hiddenInput.value.trim();
      const targetModel = document.getElementById("target-model").value.trim();

      clearError();
      resultsEl.style.display = "none";
      loadingEl.style.display = "";
      checkBtn.disabled = true;
      checkBtn.innerHTML = '<span class="loading-spinner"></span>Checking…';

      try {
        const { prompt, evaluation } = await evaluatePrompt(text, targetModel);
        renderResults(prompt, evaluation);
      } catch (err) {
        showError(err.message || "An unexpected error occurred.");
      } finally {
        loadingEl.style.display = "none";
        checkBtn.disabled = false;
        checkBtn.textContent = "Check prompt";
        isSubmitting = false;
      }
    });
  }

  init().catch(console.error);
</script>
{% endblock %}
