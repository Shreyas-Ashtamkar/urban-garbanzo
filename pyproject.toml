[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-garbanzo"
version = "0.1.0"
description = "Stop guessing if your prompts work. Get instant ratings on clarity, correctness, information density, hallucination risk, and redundancy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0" }
authors = [{ name = "Shreyas Ashtamkar", email = "shreyas@example.com" }]
keywords = ["prompt", "evaluation", "rating", "ai", "workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aerich>=0.8.2,<1.0.0",
    "anthropic>=0.52.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "openai>=1.75.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "textstat>=0.7.4,<1.0.0",
    "tortoise-orm[asyncpg]>=0.20.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0,<1.0.0",
    "asgi-lifespan>=2.1.0,<3.0.0",
    "black>=23.0.0,<26.0.0",
    "ipython>=8.0.0,<9.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pre-commit>=3.0.0,<5.0.0",
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Shreyas-Ashtamkar/urban-garbanzo"
Documentation = "https://github.com/Shreyas-Ashtamkar/urban-garbanzo#readme"
Repository = "https://github.com/Shreyas-Ashtamkar/urban-garbanzo.git"
Issues = "https://github.com/Shreyas-Ashtamkar/urban-garbanzo/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
pretty = true
plugins = []

[[tool.mypy.overrides]]
module = ["textstat"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short --cov=urban_garbanzo --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/urban_garbanzo"]
omit = ["*/__init__.py", "*/tests/*", "*/.venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if settings.DEBUG:",
]

[tool.aerich]
tortoise_orm = "urban_garbanzo.database.TORTOISE_ORM"
location = "migrations"
src_folder = "./src"
